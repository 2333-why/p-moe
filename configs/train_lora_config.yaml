model_name: models/deepseek-moe-16b-base
output_dir: outputs/stage3_lora
local_files_only: true
trust_remote_code: true

dataset_name: wikitext
dataset_config_name: wikitext-2-raw-v1
dataset_split: train
text_column: text
block_size: 1024
preprocessing_num_workers: null

torch_dtype: auto
bf16: true
fp16: false
gradient_checkpointing: true

max_steps: -1
num_train_epochs: 1.0
per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.0002
weight_decay: 0.0
warmup_steps: 100
lr_scheduler_type: cosine
optim: adamw_torch
logging_steps: 10
save_steps: 500
save_total_limit: 2
dataloader_num_workers: 0
overwrite_output_dir: false

lora_r: 16
lora_alpha: 32
lora_dropout: 0.05
lora_target_modules: null
lora_bias: none
task_type: CAUSAL_LM

use_wandb: false
wandb_project: p-moe
run_name: stage3_lora
seed: 42

router_lora_todo: TODO add router-specific LoRA target selection and p-bit ablation hooks after router inspection.
