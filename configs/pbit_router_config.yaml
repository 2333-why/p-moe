# Stage 4 p-bit router defaults.
# This config is inert by itself; scripts load it only when explicitly invoked.

num_experts: 64
top_k: 2
alpha: 0.1
beta: 0.1
temperature: 1.0
min_temperature: 0.1
temperature_decay: 1.0
load_ema_decay: 0.99
use_load_bias: true
use_competition: true
use_sampling: false
eps: 1.0e-8
normalize_gates: true

router_patch:
  scaffold_only: true
  apply_by_default: false
  require_router_inspection_first: true
