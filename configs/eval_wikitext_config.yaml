# Stage 2: WikiText causal LM perplexity defaults.
model:
  model_name: models/deepseek-moe-16b-base
  tokenizer_name: null
  local_files_only: true
  trust_remote_code: true
  torch_dtype: auto
  device_map: auto
  offload_folder: outputs/offload

dataset:
  dataset_name: wikitext
  dataset_config_name: wikitext-2-raw-v1
  split: test
  text_column: text
  streaming: false

evaluation:
  block_size: 2048
  stride: 1024
  batch_size: 1
  max_eval_tokens: null
  add_bos_token: false

output:
  output_dir: outputs/run_stage2_wikitext
  summary_name: eval_summary.json

safety:
  local_files_only: true
  print_secret_values: false
